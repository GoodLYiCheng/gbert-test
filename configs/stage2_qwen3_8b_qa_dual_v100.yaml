# Dual-V100 Stage 2 QA profile. This is single-process layer-wise model
# parallelism, so launch the ordinary CLI with exactly two visible GPUs.
seed: 20260813
generator_version: topology-v1
hardware_profile: dual_v100
device: cuda:0
output_dir: artifacts
stage1_run_dir: /home/xiewt24/liuyc/gbert-test/artifacts/stage1
allow_smoke_artifact: false
no_progress: false

data:
  cache_dir: artifacts/stage2_qa_cache
  train_graphs: 20000
  validation_graphs: 2000
  test_graphs: 5000
  prepare_device: cuda:0
  embedding_batch_size: 256

llm:
  model_id: Qwen/Qwen3-8B
  local_path: /data/Qwen/Qwen3-8B/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  dtype: float16
  attn_implementation: sdpa
  enable_thinking: false
  max_input_length: 128
  max_new_tokens: 8
  device_map: balanced
  # Compatible with both 16 GB and 32 GB V100 variants. GPU 0 retains extra
  # headroom for input embeddings, GraphTokens, outputs, and the Projector.
  max_memory:
    0: 12GiB
    1: 14GiB

projector:
  graph_dim: 128
  hidden_dim: 512
  num_tokens: 4

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  effective_batch_size: 32
  data_workers: 0
  epochs: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_ratio: 0.05
  grad_clip: 1.0
  resume_from: null

evaluation:
  bootstrap_samples: 10000
