# Aggressive single-V100 profile; requires a 32 GB V100 and at least 20 CPU cores.
seed: 20260813
generator_version: topology-v1
device: cuda
output_dir: artifacts
hidden_dim: 128
batch_size: 1024
data_workers: 20
prefetch_batches: 40
learning_rate: 0.001
weight_decay: 0.0001
grad_clip: 1.0
max_anchors: 10000000
min_anchors: 2000000
eval_every: 500000
checkpoint_every: 100000
# Fixed model-selection set, built once before training and reused at each eval.
val_size: 1024
cache_validation: true
id_test_size: 50000
ood_test_size: 50000
perturb_tolerance: 0.02
perturb_attempts: 1
ranking_margin: 0.05
lambda_rank: 1.0
lambda_stat: 1.0
coverage_update_every: 10000
coverage_min_count: 10000
coverage_js_threshold: 0.05
stability_evals: 5
stability_delta: 0.002
no_progress: false
