# Formal single-A100 Stage 2 QA MVP. Replace this with the completed remote
# Stage 1 run containing the export, manifest, metrics, and report.
seed: 20260813
generator_version: topology-v1
device: cuda
output_dir: artifacts
stage1_run_dir: /absolute/path/to/formal/stage1_run
allow_smoke_artifact: false
no_progress: false

data:
  cache_dir: artifacts/stage2_qa_cache
  train_graphs: 20000
  validation_graphs: 2000
  test_graphs: 5000
  prepare_device: cuda
  embedding_batch_size: 256

llm:
  model_id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  dtype: bfloat16
  attn_implementation: sdpa
  enable_thinking: false
  max_input_length: 128
  max_new_tokens: 8

projector:
  graph_dim: 128
  hidden_dim: 512
  num_tokens: 4

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  effective_batch_size: 32
  data_workers: 0
  epochs: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_ratio: 0.05
  grad_clip: 1.0
  resume_from: null

evaluation:
  bootstrap_samples: 10000
